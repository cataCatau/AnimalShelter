<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adopt Animal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">

<div class="form-card" style="width:460px;">
    <div class="form-card-header">
        <h3>❤️ Adoption Process</h3>
    </div>

    <div class="form-card-body">
        <p style="font-size:.85rem;color:var(--txt-secondary);margin:0 0 22px;text-align:center;">
            Fill in your details to give this animal a forever home 🏡
        </p>

        <form th:action="@{/shelters/{sId}/animals/{aId}/adopt(sId=${shelterId},aId=${animalId})}"
              th:object="${person}" method="post">

            <div class="flex-row">
                <div class="form-group flex-item">
                    <label>First Name</label>
                    <input type="text" th:field="*{firstName}" placeholder="John" required>
                </div>
                <div class="form-group flex-item">
                    <label>Last Name</label>
                    <input type="text" th:field="*{lastName}" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" th:field="*{phone}" placeholder="07xx xxx xxx" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" th:field="*{email}" placeholder="john@example.com" required>
            </div>

            <div class="button-group">
                <a th:href="@{/shelters/{id}/animals(id=${shelterId})}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit">❤ Finalize Adoption</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
