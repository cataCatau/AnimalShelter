<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Shelter Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        background-image: url('/background_login.png');
        background-size: 100% 100%;
    }
</style>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow-lg" style="width: 400px; border-radius: 15px;">
    <div class="card-header bg-black text-white text-center py-3" style="border-radius: 15px 15px 0 0;">
        <h3 class="mb-0">🔐 Authentication</h3>
    </div>

    <div class="card-body p-4">

        <div th:if="${error != null}" class="alert alert-danger text-center" role="alert" th:text="${error}">
            Error message will appear here.
        </div>

        <form action="/login" method="post">

            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Login</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
