<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Records</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="main-header">
    <div>
        <h2 class="header-title">🏥 Medical History</h2>
        <p class="header-subtitle" th:text="'Patient: ' + ${animal.name} + ' · ' + ${animal.species}"></p>
    </div>
    <div class="header-actions">
        <a th:href="@{/shelters}" class="btn-action btn-header btn-logout">⬅ Back</a>
    </div>
</div>

<div class="page-container">
    <div class="medical-layout">

        <!-- LEFT: Add form -->
        <div class="medical-form-panel">
            <div class="panel-title">➕ Add Intervention</div>

            <form th:action="@{/animals/{id}/medical-records/save(id=${animal.id})}" th:object="${newRecord}" method="post">

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" th:field="*{interventionDate}" required>
                </div>

                <div class="form-group">
                    <label>Intervention Type</label>
                    <input type="text" th:field="*{interventionType}" placeholder="e.g. Rabies Vaccine, Surgery..." required>
                </div>

                <div class="form-group">
                    <label>Notes / Description</label>
                    <textarea th:field="*{description}" rows="4"
                              placeholder="Details about the procedure..."
                    ></textarea>
                </div>

                <button type="submit" class="btn-submit" style="width:100%;margin-top:4px;">Save Record</button>
            </form>
        </div>

        <!-- RIGHT: Records table -->
        <div class="medical-table-panel">

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(records)}" class="medical-empty">
                <div style="font-size:2.5rem;opacity:.3;margin-bottom:12px;">🩺</div>
                <p style="color:var(--txt-muted);font-size:.9rem;margin:0;">No medical records found for this animal.</p>
            </div>

            <table class="stats-table" th:if="${!#lists.isEmpty(records)}" style="margin-top:0;">
                <thead>
                <tr>
                    <th style="width:140px;">Date</th>
                    <th style="width:200px;">Intervention</th>
                    <th>Notes &amp; Details</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record : ${records}">
                    <td>
                            <span style="font-family:'DM Serif Display',serif;font-size:1rem;color:var(--honey);"
                                  th:text="${record.interventionDate}"></span>
                    </td>
                    <td>
                        <span class="intervention-badge" th:text="${record.interventionType}"></span>
                    </td>
                    <td style="text-align:left;color:var(--stone-light);font-size:.88rem;line-height:1.5;"
                        th:text="${record.description}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
