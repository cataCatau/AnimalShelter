<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="login-card" style="width: 500px;">
    <div class="login-header">
        <h3>👥 Add New Employee</h3>
    </div>

    <div class="login-body">
        <div th:if="${error}" class="error-banner">
            <span class="error-icon">⚠️</span>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/shelters/{id}/employees/save(id=${shelterId})}" th:object="${employee}" method="post">

            <input type="hidden" th:field="*{id}" />

            <div class="flex-row">
                <div class="form-group flex-item">
                    <label>First Name</label>
                    <input type="text" th:field="*{firstName}" required>
                </div>
                <div class="form-group flex-item">
                    <label>Last Name</label>
                    <input type="text" th:field="*{lastName}" required>
                </div>
            </div>

            <div class="flex-row">
                <div class="form-group flex-item">
                    <label>Username</label>
                    <input type="text" th:field="*{username}" required>
                </div>
                <div class="form-group flex-item">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" required>
                </div>
            </div>

            <div class="flex-row">
                <div class="form-group flex-item">
                    <label>Role</label>
                    <input type="text" th:field="*{role}" placeholder="e.g. Caregiver, Manager" required>
                </div>
                <div class="form-group flex-item">
                    <label>Phone</label>
                    <input type="tel" th:field="*{phone}" placeholder="07xx xxx xxx" required>
                </div>
            </div>

            <div class="form-group">
                <label>Salary (RON)</label>
                <input type="number" th:field="*{salary}" step="100" required>
            </div>

            <div class="button-group">
                <a th:href="@{/shelters/{id}/employees(id=${shelterId})}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit">Save Employee</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
