<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animal Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">

<div class="form-card">
    <div class="form-card-header">
        <h3>🐾 Animal Registration</h3>
    </div>

    <div class="form-card-body">

        <div th:if="${error}" class="error-banner">
            <span class="error-icon">⚠️</span>
            <span th:text="${error}"></span>
        </div>

        <form action="#" th:action="@{/shelters/{id}/animals/save(id=${shelterId})}" th:object="${animal}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label>Name</label>
                <input type="text" th:field="*{name}" placeholder="e.g. Rex" required>
            </div>

            <div class="flex-row">
                <div class="form-group flex-item">
                    <label>Species</label>
                    <input type="text" th:field="*{species}" placeholder="e.g. Dog" required>
                </div>
                <div class="form-group flex-item">
                    <label>Breed</label>
                    <input type="text" th:field="*{breed}" placeholder="e.g. Shepherd">
                </div>
            </div>

            <div class="flex-row">
                <div class="form-group flex-item">
                    <label>Date of Birth</label>
                    <input type="date" th:field="*{dateOfBirth}" th:max="${today}">
                </div>
                <div class="form-group flex-item">
                    <label>Date of Entry</label>
                    <input type="date" th:field="*{dateOfEntry}" th:max="${today}" required>
                </div>
            </div>

            <div class="flex-row">
                <div class="form-group flex-item">
                    <label>Cage ID</label>
                    <input type="number" th:field="*{cageId}" placeholder="e.g. 1" required>
                </div>
                <div class="form-group flex-item">
                    <label>Gender</label>
                    <select th:field="*{gender}">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Unknown">Unknown</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Image URL</label>
                <input type="text" th:field="*{imageUrl}" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" placeholder="Personality, history, quirks..." rows="3"></textarea>
            </div>

            <div class="button-group">
                <a th:href="@{/shelters/{id}/animals(id=${shelterId})}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit">Save Animal</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
