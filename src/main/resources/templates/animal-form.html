<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Animal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="login-card" style="width: 500px;">
    <div class="login-header">
        <h3>🐾 Animal Registration</h3>
    </div>

    <div class="login-body">

        <form action="#" th:action="@{/shelters/{id}/animals/save(id=${shelterId})}" th:object="${animal}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="form-group">
                <label>Name</label>
                <input type="text" th:field="*{name}" placeholder="Ex: Rex" required>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="width: 50%;">
                    <label>Species</label>
                    <input type="text" th:field="*{species}" placeholder="Ex: Dog" required>
                </div>
                <div class="form-group" style="width: 50%;">
                    <label>Breed</label>
                    <input type="text" th:field="*{breed}" placeholder="Ex: Shepherd">
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="width: 50%;">
                    <label>Date of Birth</label>
                    <input type="date" th:field="*{dateOfBirth}">
                </div>
                <div class="form-group" style="width: 50%;">
                    <label>Date of Entry</label>
                    <input type="date" th:field="*{dateOfEntry}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Cage ID</label>
                <input type="number" th:field="*{cageId}" placeholder="Ex: 1" required>
            </div>

            <div class="form-group">
                <label>Image URL</label>
                <input type="text" th:field="*{imageUrl}" placeholder="Link to the animal's image...">
            </div>

            <div class="form-group" style="width: 40%;">
                <label>Gender</label>
                <select th:field="*{gender}" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Unknown">Unknown</option>
                </select>
            </div>

            <div class="form-group" style="width: 60%;">
                <label>Description (Personality, history...)</label>
                <textarea th:field="*{description}" placeholder="An active and loving nature..." rows="2" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; resize: vertical;"></textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <a th:href="@{/shelters/{id}/animals(id=${shelterId})}" class="btn-custom" style="background-color: #6c757d; text-align: center; width: 30%; text-decoration: none;">Cancel</a>
                <button type="submit" class="btn-login" style="margin-top: 0; width: 70%;">Save Animal</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
