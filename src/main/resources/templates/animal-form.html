<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Adaugă Animal Nou</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page"> <!-- Folosim același fundal centrat ca la login -->

<div class="login-card" style="width: 500px;"> <!-- L-am făcut puțin mai lat -->
    <div class="login-header">
        <h3>🐾 Înregistrare Animal</h3>
    </div>

    <div class="login-body">

        <!-- th:object leagă formularul de obiectul 'animal' din Controller -->
        <form action="#" th:action="@{/shelters/{id}/animals/save(id=${shelterId})}" th:object="${animal}" method="post">

            <div class="form-group">
                <label>Nume</label>
                <input type="text" th:field="*{name}" placeholder="Ex: Rex" required>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="width: 50%;">
                    <label>Specie</label>
                    <input type="text" th:field="*{species}" placeholder="Ex: Câine" required>
                </div>
                <div class="form-group" style="width: 50%;">
                    <label>Rasă</label>
                    <input type="text" th:field="*{breed}" placeholder="Ex: Ciobănesc">
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="width: 50%;">
                    <label>Data Nașterii</label>
                    <!-- type="date" va deschide automat un calendar în browser -->
                    <input type="date" th:field="*{dateOfBirth}">
                </div>
                <div class="form-group" style="width: 50%;">
                    <label>Data Intrării</label>
                    <input type="date" th:field="*{dateOfEntry}" required>
                </div>
            </div>

            <div class="form-group">
                <label>ID Cușcă (Cage ID)</label>
                <!-- Momentan utilizatorul scrie ID-ul manual. Mai târziu îl putem face un meniu drop-down (select) -->
                <input type="number" th:field="*{cageId}" placeholder="Ex: 1" required>
            </div>

            <div class="form-group">
                <label>URL Poză</label>
                <input type="text" th:field="*{imageUrl}" placeholder="Link către imaginea animalului...">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <a th:href="@{/shelters/{id}/animals(id=${shelterId})}" class="btn-custom" style="background-color: #6c757d; text-align: center; width: 30%; text-decoration: none;">Anulează</a>
                <button type="submit" class="btn-login" style="margin-top: 0; width: 70%;">Salvează Animal</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
