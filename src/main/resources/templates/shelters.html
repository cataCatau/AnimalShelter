<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shelters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h2>Shelters</h2>
        </div>
        <div class="card-body">

            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Country</th>
                    <th>City</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="shelter : ${shelters}">
                    <td th:text="${shelter.id}"></td>
                    <td th:text="${shelter.name}"></td>
                    <td th:text="${shelter.country}"></td>
                    <td th:text="${shelter.city}"></td>
                    <td>
                        <a th:href="@{/shelters/{id}/animals(id=${shelter.id})}" class="btn btn-sm btn-info text-white">View Animals</a>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

</body>
</html>
