<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ours Animals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-container">

    <div class="page-header">
        <a th:if="${shelterId != null}" th:href="@{/shelters/{id}/animals/new(id=${shelterId})}" class="btn-custom">
            + Add animal
        </a>
    </div>

    <div class="animals-grid">

        <div class="animal-card" th:each="animal : ${animals}">

            <div class="animal-img-wrapper">
                <img th:if="${animal.imageUrl != null}" th:src="${animal.imageUrl}" class="animal-img" alt="Poză animal">
                <img th:if="${animal.imageUrl == null}" src="https://via.placeholder.com/300x400?text=Fără+Poză" class="animal-img" alt="Fără Poză">
            </div>

            <div class="animal-info">
                <h3 class="animal-name" th:text="${animal.name}">Nume Animal</h3>

                <p class="icon-text">🪪 <strong>ID:</strong> <span th:text="${animal.id}"></span></p>
                <p class="icon-text">🔒 <strong>Cage ID:</strong> <span th:text="${animal.cageId}"></span></p>
                <p class="icon-text">🐾 <strong>Species:</strong> <span th:text="${animal.species}"></span></p>
                <p class="icon-text">❤️ <strong>Breed:</strong> <span th:text="${animal.breed}"></span></p>
                <p class="icon-text">📅 <strong>Date of Birth:</strong> <span th:text="${animal.dateOfBirth}"></span></p>
                <p class="icon-text">📅 <strong>Date of Entry:</strong> <span th:text="${animal.dateOfEntry}"></span></p>
                <p class="icon-text">🚻 <strong>Gender:</strong> <span th:text="${animal.gender}"></span></p>
                <p class="text-muted italic-small"><em th:text="${animal.description}"></em></p>

                <div class="animal-actions">
                    <a th:href="@{/shelters/{sId}/animals/{aId}/edit(sId=${shelterId}, aId=${animal.id})}" class="btn-orange">Actions</a>
                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
