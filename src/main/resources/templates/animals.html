<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Animals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-container">

    <div class="page-header">
        <a th:if="${shelterId != null}" th:href="@{/shelters/{id}/animals/new(id=${shelterId})}" class="btn-custom">
            + Add animal
        </a>
    </div>

    <div class="animals-grid">

        <div class="animal-card" th:each="animal : ${animals}">

            <div class="animal-img-wrapper">
                <img th:if="${animal.imageUrl != null}" th:src="${animal.imageUrl}" class="animal-img" alt="Animal photo">
                <img th:if="${animal.imageUrl == null}" src="https://via.placeholder.com/400x500?text=No+Photo" class="animal-img" alt="No photo available">
            </div>

            <div class="animal-content">

                <div class="animal-header">
                    <h3 class="animal-name" th:text="${animal.name}">Animal Name</h3>
                    <div class="animal-breed" th:text="${animal.species} + ' • ' + ${animal.breed}">Species • Breed</div>
                </div>

                <div class="animal-details-grid">
                    <div class="detail-item">🪪 <strong>ID:</strong> <span th:text="${animal.id}"></span></div>
                    <div class="detail-item">🔒 <strong>Cage:</strong> <span th:text="${animal.cageId}"></span></div>
                    <div class="detail-item">🚻 <strong>Gender:</strong> <span th:text="${animal.gender}"></span></div>
                    <div class="detail-item">🎂 <strong>Born:</strong> <span th:text="${animal.dateOfBirth}"></span></div>
                    <div class="detail-item" style="grid-column: span 2;">📅 <strong>Entry Date:</strong> <span th:text="${animal.dateOfEntry}"></span></div>
                </div>

                <p class="animal-desc" th:text="'&ldquo;' + ${animal.description} + '&rdquo;'"></p>

                <div class="animal-footer">
                    <div class="adoption-score-container">
                        <div class="score-header">
                            <span>📈 Adoption Chance</span>
                            <span class="score-value" th:text="${animal.adoptionScore} + '%'"></span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill"
                                 th:styleappend="'width: ' + ${animal.adoptionScore} + '%; background-color: ' + (${animal.adoptionScore} > 75 ? '#28a745' : (${animal.adoptionScore} > 40 ? '#ffc107' : '#dc3545')) + ';'">
                            </div>
                        </div>
                    </div>

                    <div class="animal-actions" style="display: flex; gap: 10px;">
                        <a th:href="@{/shelters/{sId}/animals/{aId}/edit(sId=${shelterId}, aId=${animal.id})}" class="btn-action"> ✏️️ Edit</a>

                        <a th:href="@{/shelters/{shelterId}/animals/{animalId}/delete(shelterId=${shelterId}, animalId=${animal.id})}"
                           class="btn-action btn-delete"
                           onclick="return confirm('Are you sure you want to delete this animal?');">🗑️ Delete</a>

                        <a th:if="${!animal.isAdopted}" th:href="@{/shelters/{shelterId}/animals/{animalId}/adopt(shelterId=${shelterId}, animalId=${animal.id})}" class="btn-action btn-adopt">❤️ Adopt</a>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
