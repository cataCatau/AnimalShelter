<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="main-header">
    <div>
        <h2 class="header-title">🐾 Shelter Animals</h2>
        <p class="header-subtitle">Looking for a forever home</p>
    </div>
    <div class="header-actions">
        <a th:if="${shelterId != null}"
           th:href="@{/shelters/{id}/animals/new(id=${shelterId})}"
           class="btn-action btn-header btn-add">+ Add Animal</a>
        <a th:href="@{/shelters}" class="btn-action btn-header btn-logout">⬅ Back</a>
    </div>
</div>

<div class="page-container">
    <div class="animals-grid">

        <div class="animal-card" th:each="animal : ${animals}">

            <div class="animal-img-wrapper">
                <img th:if="${animal.imageUrl != null}"
                     th:src="${animal.imageUrl}"
                     class="animal-img"
                     alt="Animal photo">
                <img th:if="${animal.imageUrl == null}"
                     src="https://via.placeholder.com/260x420?text=No+Photo"
                     class="animal-img"
                     alt="No photo">

                <span style="position:relative;z-index:2;background:var(--honey);color:var(--onyx);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:2px 9px;border-radius:4px;align-self:flex-start;"
                      th:text="${animal.species}">Species</span>
            </div>

            <div class="animal-content">
                <div class="animal-header">
                    <div>
                        <h3 class="animal-name" th:text="${animal.name}">Name</h3>
                        <div class="animal-breed" th:text="${animal.breed}">Breed</div>
                    </div>
                </div>

                <div class="animal-details-grid">
                    <span class="detail-item">🪪 <strong>ID:</strong> <span th:text="${animal.id}"></span></span>
                    <span class="detail-item">🔒 <strong>Cage:</strong> <span th:text="${animal.cageId}"></span></span>
                    <span class="detail-item">🚻 <strong>Gender:</strong> <span th:text="${animal.gender}"></span></span>
                    <span class="detail-item">🎂 <strong>Born:</strong> <span th:text="${animal.dateOfBirth}"></span></span>
                    <span class="detail-item">📅 <strong>Entry:</strong> <span th:text="${animal.dateOfEntry}"></span></span>
                </div>

                <p class="animal-desc" th:text="'&ldquo;' + ${animal.description} + '&rdquo;'"></p>

                <div class="animal-footer">
                    <div class="adoption-score-container">
                        <div class="score-header">
                            <span>Adoption chance</span>
                            <span class="score-value" th:text="${animal.adoptionScore} + '%'"></span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill"
                                 th:styleappend="'width:' + ${animal.adoptionScore} + '%;background:' + (${animal.adoptionScore} > 75 ? '#5aaa65' : (${animal.adoptionScore} > 40 ? '#f0c060' : '#c05030')) + ';'">
                            </div>
                        </div>
                    </div>

                    <div class="animal-actions">
                        <a th:href="@{/shelters/{sId}/animals/{aId}/edit(sId=${shelterId},aId=${animal.id})}"
                           class="btn-action">✏ Edit</a>
                        <a th:href="@{/animals/{id}/medical-records(id=${animal.id})}" class="btn-action">🏥 Medical</a>
                        <a th:href="@{/shelters/{sId}/animals/{aId}/delete(sId=${shelterId},aId=${animal.id})}"
                           class="btn-action btn-delete"
                           onclick="return confirm('Delete this animal?')">🗑 Delete</a>
                        <a th:if="${!animal.isAdopted}"
                           th:href="@{/shelters/{sId}/animals/{aId}/adopt(sId=${shelterId},aId=${animal.id})}"
                           class="btn-action btn-adopt">❤ Adopt</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
