<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Animalele Noastre</title>
    <!-- Importăm Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizat pentru a potrivi designul cu poza ta -->
    <style>
        body {
            background-color: #f0f8ff; /* Un albastru foarte deschis, ca în poză */
        }
        .animal-card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            overflow: hidden; /* Ține imaginea înăuntrul marginilor rotunjite */
            transition: transform 0.2s;
            background-color: white;
        }
        .animal-card:hover {
            transform: translateY(-5px); /* Efect de ridicare la hover */
        }
        .animal-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Taie imaginea perfect fără să o deformeze */
            min-height: 250px;
        }
        .btn-orange {
            background-color: #fbb03b; /* Portocaliul din poza ta */
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            padding: 8px 20px;
        }
        .btn-orange:hover {
            background-color: #e59a2f;
            color: white;
        }
        .icon-text {
            font-size: 0.95rem;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Sistemul de Grid Bootstrap (2 coloane pe ecrane medii/mari) -->
    <div class="row">
        <!-- Iterăm prin lista de animale -->
        <div class="col-lg-6 mb-4" th:each="animal : ${animals}">

            <!-- Construcția Card-ului Orizontal -->
            <div class="card animal-card h-100">
                <div class="row g-0 h-100">

                    <!-- Coloana din stânga: Imaginea -->
                    <div class="col-md-5">
                        <img th:if="${animal.imageUrl != null}" th:src="${animal.imageUrl}" class="animal-img" alt="Poză animal">
                        <!-- Dacă nu are poză, punem un placeholder -->
                        <img th:if="${animal.imageUrl == null}" src="https://via.placeholder.com/300x400?text=Fără+Poză" class="animal-img" alt="Fără Poză">
                    </div>

                    <!-- Coloana din dreapta: Detaliile -->
                    <div class="col-md-7">
                        <div class="card-body d-flex flex-column h-100">
                            <!-- Numele animalului -->
                            <h3 class="card-title fw-bold text-uppercase mb-3" th:text="${animal.name}"></h3>

                            <p class="card-text mb-1 icon-text">
                                🪪 <strong>ID:</strong> <span th:text="${animal.id}"></span>
                            </p>

                            <p class="card-text mb-1 icon-text">
                                🔒 <strong>Cage ID:</strong> <span th:text="${animal.cageId}"></span>
                            </p>
                            <p class="card-text mb-1 icon-text">
                                🐾 <strong>Specie:</strong> <span th:text="${animal.species}"></span>
                            </p>
                            <p class="card-text mb-1 icon-text">
                                ❤️ <strong>Rasă:</strong> <span th:text="${animal.breed}"></span>
                            </p>
                            <p class="card-text mb-1 icon-text">
                                📅 <strong>Ziua Nașterii:</strong> <span th:text="${animal.dateOfBirth}"></span>
                            </p>
                            <p class="card-text mb-3 icon-text">
                                📅 <strong>Data Intrării:</strong> <span th:text="${animal.dateOfEntry}"></span>
                            </p>

                            <!-- Texte Placeholder (Vor fi înlocuite când le adaugi în DB) -->
                            <p class="card-text mb-2 icon-text text-muted">
                                ♂️ <strong>Sex:</strong> Mascul
                            </p>
                            <p class="card-text mb-3 text-muted" style="font-size: 0.9rem;">
                                <em>O fire activă și iubitoare.</em>
                            </p>

                            <!-- Butonul care stă mereu la bază datorită lui mt-auto -->
                            <div class="mt-auto text-center">
                                <a href="#" class="btn btn-orange w-100">Află Mai Multe</a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
            <!-- Sfârșit Card -->

        </div>
    </div>
</div>

</body>
</html>
